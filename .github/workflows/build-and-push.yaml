name: Build and Push Image

on:
  push:
    branches: [master]
    paths-ignore:
      - k8s/**
      - argocd/**
      - "**.md"

permissions:
  contents: write
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image tag
        id: vars
        run: echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/fk8s:${{ steps.vars.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/fk8s:latest

      - name: Bump image tag in deployment manifest
        run: |
          sed -i "s|image: ghcr.io/.*/fk8s:.*|image: ghcr.io/${{ github.repository_owner }}/fk8s:${{ steps.vars.outputs.tag }}|" k8s/deployment.yaml

      - name: Commit and push manifest update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git diff --cached --quiet && exit 0
          git commit -m "chore: bump image to ${{ steps.vars.outputs.tag }}"
          git push
