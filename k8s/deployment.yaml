apiVersion: apps/v1
kind: Deployment
metadata:
  name: fk8s
  namespace: fk8s
  labels:
    app: fk8s
spec:
  replicas: 4
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  minReadySeconds: 10
  progressDeadlineSeconds: 120
  selector:
    matchLabels:
      app: fk8s
  template:
    metadata:
      labels:
        app: fk8s
    spec:
      imagePullSecrets:
        - name: ghcr-pull-secret
      containers:
        - name: fk8s
          image: ghcr.io/felipejunges/fk8s:6e49755
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: ASPNETCORE_HTTP_PORTS
              value: "8080"
          startupProbe:
            httpGet:
              path: /weatherforecast
              port: http
            failureThreshold: 30
            periodSeconds: 5
          readinessProbe:
            httpGet:
              path: /weatherforecast
              port: http
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /weatherforecast
              port: http
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
