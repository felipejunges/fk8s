apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fk8s
  namespace: argocd
spec:
  project: default
  source:
    repoURL: <your-git-remote-url>   # e.g. https://github.com/you/fk8s.git
    targetRevision: main
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: fk8s
  syncPolicy:
    automated:
      prune: true      # delete resources removed from git
      selfHeal: true    # revert manual kubectl edits/drift back to git state
    syncOptions:
      - CreateNamespace=false   # k8s/namespace.yaml already creates it