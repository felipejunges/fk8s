apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: root-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/felipejunges/fk8s
    targetRevision: master
    path: argocd/apps
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated:
      prune: true      # delete child Applications removed from argocd/apps
      selfHeal: true    # revert manual kubectl edits/drift back to git state
    syncOptions:
      - CreateNamespace=false