apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: fk8s
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/felipejunges/fk8s
    targetRevision: master
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: fk8s
  syncPolicy:
    automated:
      prune: true      # delete resources removed from git
      selfHeal: true    # revert manual kubectl edits/drift back to git state
    syncOptions:
      - CreateNamespace=false   # k8s/namespace.yaml already creates it